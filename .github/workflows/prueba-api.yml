name: API Integration & Consumption

on: [push]

jobs:
  api-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASO 1: Levantar la API en segundo plano
      - name: Start API Service
        run: docker compose up -d flask-api

      # PASO 2: Ejecutar Newman contra la red de Docker
      - name: Run Newman Tests
        run: |
          docker compose run --rm newman-tests

      # PASO 3: Preparar entorno Python
      - name: Install Python dependencies
        run: pip install requests

      # PASO 4: Consumo desde Python (Falla el pipeline si el script da error)
      - name: Consume API via Python
        run: python scripts/consume_api.py
        env:
          BASE_URL: http://localhost:5000

      # PASO 5: Limpieza total
      - name: Stop Containers
        if: always()
        run: docker compose down