name: API Integration & Consumption

on: [push]

jobs:
  # JOB 1: Validación y Generación de Reporte
  api-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Creamos la carpeta con permisos antes de iniciar Docker
      - name: Prepare report directory
        run: |
          mkdir -p newman-reports
          chmod 777 newman-reports

      - name: Start API Service
        run: docker compose up -d flask-api

      - name: Run Newman Tests
        run: |
          docker compose run --rm newman-tests

      # EL SECRETO: Subir el artefacto en el mismo Job donde se crea
      - name: Upload Newman Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: newman-html-report
          path: newman-reports/report.html
          if-no-files-found: error

      - name: Stop Containers
        if: always()
        run: docker compose down

  # JOB 2: Consumo desde Python (Solo si el Job 1 fue exitoso)
  python-consumption:
    runs-on: ubuntu-latest
    needs: api-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Start API for Python
        run: docker compose up -d flask-api

      - name: Consume API via Python
        run: python scripts/consume_api.py
        env:
          BASE_URL: http://localhost:5000

      - name: Stop Containers
        if: always()
        run: docker compose down