name: API Integration & Consumption

on: [push]

jobs:
  api-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASO 1: Levantar la API en segundo plano
      - name: Start API Service
        run: docker compose up -d flask-api

      # PASO 2: Newman (Validación de Colección)
      - name: Run Newman Tests
        run: docker compose run newman-tests

      # PASO 3: Instalación de Dependencias
      - name: Install Python dependencies
        run: pip install requests

      # PASO 4: Consumo desde Python
      # Si el script termina en sys.exit(1), este paso fallará y detendrá el pipeline
      - name: Consume API via Python
        run: python scripts/consume_api.py

      # PASO 5: Limpieza (se ejecuta siempre, falle o no el anterior)
      - name: Stop Containers
        if: always()
        run: docker compose down