steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Levantamos la API en segundo plano y esperamos a que esté 'healthy'
      - name: Start API Service
        run: docker compose up -d flask-api

      # Ejecutamos Newman contra la API que ya está arriba
      # Usamos el nombre del servicio 'flask-api' para la red interna de Docker
      - name: Run Newman Tests
        run: |
          docker compose run --rm \
          -e baseUrl=http://flask-api:5000 \
          newman-tests

      - name: Install Python dependencies
        run: pip install requests

      # Ahora el script de Python usa 'localhost' porque la API sigue arriba y mapeada
      - name: Consume API via Python
        run: python scripts/consume_api.py
        env:
          BASE_URL: http://localhost:5000

      - name: Stop Containers
        if: always()
        run: docker compose down